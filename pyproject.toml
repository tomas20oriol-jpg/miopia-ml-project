[project]
name = "miopia-ml"
version = "0.1.0"
description = "Final project ML 2026/27: myopia prediction (M, MM, COMBO, DCOMBO)"
authors = [
    {name = "Tomás Oriol Freixa"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas (>=2.2,<4.0)",
    "numpy (>=2.0,<3.0)",
    "scipy (>=1.14,<2.0)",
    "scikit-learn (>=1.5,<2.0)",
    "imbalanced-learn (>=0.12,<1.0)",
    "xgboost (>=2.1,<4.0)",
    "lightgbm (>=4.5,<5.0)",
    "matplotlib (>=3.9,<4.0)",
    "seaborn (>=0.13,<0.14)",
    "statsmodels (>=0.14,<1.0)",
    "shap (>=0.46,<1.0)",
    "ipykernel (>=6.29,<8.0)",
    "jupyter (>=1.1,<2.0)",
]

[tool.poetry]
packages = [{include = "miopia", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]
